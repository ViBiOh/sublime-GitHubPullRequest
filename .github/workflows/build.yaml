---
name: Python

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  issues: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

env:
  RUFF_VERSION: "0.16.3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install ruff
        run: python3 -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"
      - name: Check
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check --diff .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Unit tests
        run: python3 -m unittest discover -p '*_test.py' --verbose
      - name: Compile sublime glue
        run: python3 -m py_compile plugin.py anchors.py
